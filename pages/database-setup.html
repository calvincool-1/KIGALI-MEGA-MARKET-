<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Setup & Testing - Kigali Mega Market</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { background: var(--light-gray); padding: 2rem; }
        .setup-container { max-width: 1000px; margin: 0 auto; }
        .setup-section { background: white; padding: 2rem; margin-bottom: 1.5rem; border-radius: var(--border-radius); box-shadow: var(--box-shadow); }
        .test-item { padding: 1rem; margin: 0.5rem 0; border-radius: var(--border-radius); border-left: 4px solid var(--gray); }
        .test-pass { background: #d1fae5; border-left-color: var(--secondary-color); }
        .test-fail { background: #fee2e2; border-left-color: var(--danger-color); }
        .test-pending { background: #fef3c7; border-left-color: var(--warning-color); }
        .progress-bar { width: 100%; height: 30px; background: var(--light-gray); border-radius: var(--border-radius); overflow: hidden; margin: 1rem 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); transition: width 0.3s ease; }
        .log-container { background: #1f2937; color: #10b981; padding: 1rem; border-radius: var(--border-radius); font-family: monospace; font-size: 0.9rem; max-height: 300px; overflow-y: auto; }
        .log-entry { margin: 0.25rem 0; }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-info { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="setup-container">
        <h1>🗄️ Database Setup & Testing</h1>
        <p>Initializing Kigali Mega Market database with proper structure and relationships</p>

        <div class="setup-section">
            <h2>Setup Progress</h2>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <p id="progressText">Initializing...</p>
        </div>

        <div class="setup-section">
            <h2>Database Structure</h2>
            <div id="structureTests"></div>
        </div>

        <div class="setup-section">
            <h2>Relationships Testing</h2>
            <div id="relationshipTests"></div>
        </div>

        <div class="setup-section">
            <h2>Security Rules</h2>
            <div id="securityTests"></div>
        </div>

        <div class="setup-section">
            <h2>Sample Data</h2>
            <div id="sampleDataTests"></div>
        </div>

        <div class="setup-section">
            <h2>Setup Log</h2>
            <div id="logContainer" class="log-container"></div>
        </div>

        <div class="setup-section">
            <h2>Actions</h2>
            <button id="initBtn" class="btn-primary btn-large" onclick="initializeDatabase()">Initialize Database</button>
            <button id="testBtn" class="btn-secondary btn-large" onclick="runTests()" disabled>Run Tests</button>
            <button id="resetBtn" class="btn-danger btn-large" onclick="resetDatabase()" disabled>Reset Database</button>
        </div>

        <div id="finalResult" class="setup-section hidden">
            <h2>Final Result</h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script type="module">
        import '../js/routes.js';
        import firebaseConfig from '../config/firebase.js';
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let adminUser = null;
        let testUsers = {};
        let testProducts = {};
        let testOrders = {};

        // Logging function
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Update progress
        function updateProgress(percent, text) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        // Add test result
        function addTestResult(containerId, name, status, details = '') {
            const container = document.getElementById(containerId);
            const testDiv = document.createElement('div');
            testDiv.className = `test-item test-${status}`;
            testDiv.innerHTML = `
                <strong>${status === 'pass' ? '✓' : status === 'fail' ? '✗' : '⏳'} ${name}</strong>
                ${details ? `<br><small>${details}</small>` : ''}
            `;
            container.appendChild(testDiv);
        }

        // Initialize Database
        window.initializeDatabase = async function() {
            log('Starting database initialization...', 'info');
            updateProgress(0, 'Starting...');
            
            try {
                // Step 1: Create Admin User
                updateProgress(10, 'Creating admin user...');
                log('Creating admin user...', 'info');
                
                const adminEmail = 'admin@kigalimegamarket.com';
                const adminPassword = 'admin123456';
                
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(adminEmail, adminPassword);
                    adminUser = userCredential.user;
                    log('Admin user created successfully', 'success');
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') {
                        log('Admin user already exists, signing in...', 'info');
                        const userCredential = await auth.signInWithEmailAndPassword(adminEmail, adminPassword);
                        adminUser = userCredential.user;
                        log('Signed in as admin', 'success');
                    } else {
                        throw error;
                    }
                }

                // Step 2: Set Admin Data
                updateProgress(20, 'Setting up admin profile...');
                await db.ref('users/' + adminUser.uid).set({
                    uid: adminUser.uid,
                    email: adminEmail,
                    fullName: 'System Administrator',
                    phone: '+250788000000',
                    userType: 'admin',
                    verified: true,
                    createdAt: Date.now()
                });
                log('Admin profile created', 'success');
                addTestResult('structureTests', 'Admin User', 'pass', 'Created and verified');

                // Step 3: Create Test Buyer
                updateProgress(30, 'Creating test buyer...');
                log('Creating test buyer...', 'info');
                const buyerCred = await auth.createUserWithEmailAndPassword('buyer@test.com', 'buyer123');
                testUsers.buyer = buyerCred.user;
                
                await db.ref('users/' + testUsers.buyer.uid).set({
                    uid: testUsers.buyer.uid,
                    email: 'buyer@test.com',
                    fullName: 'Test Buyer',
                    phone: '+250788111111',
                    userType: 'buyer',
                    verified: true,
                    createdAt: Date.now()
                });
                log('Test buyer created', 'success');
                addTestResult('structureTests', 'Buyer User', 'pass', 'Created and verified');

                // Step 4: Create Test Seller
                updateProgress(40, 'Creating test seller...');
                log('Creating test seller...', 'info');
                const sellerCred = await auth.createUserWithEmailAndPassword('seller@test.com', 'seller123');
                testUsers.seller = sellerCred.user;
                
                await db.ref('users/' + testUsers.seller.uid).set({
                    uid: testUsers.seller.uid,
                    email: 'seller@test.com',
                    fullName: 'Test Seller',
                    phone: '+250788222222',
                    userType: 'seller',
                    businessName: 'Test Shop',
                    businessAddress: 'Kigali, Rwanda',
                    verified: true,
                    createdAt: Date.now()
                });
                log('Test seller created', 'success');
                addTestResult('structureTests', 'Seller User', 'pass', 'Created with business info');

                // Step 5: Create Test Logistics
                updateProgress(50, 'Creating test logistics partner...');
                log('Creating test logistics partner...', 'info');
                const logisticsCred = await auth.createUserWithEmailAndPassword('logistics@test.com', 'logistics123');
                testUsers.logistics = logisticsCred.user;
                
                await db.ref('users/' + testUsers.logistics.uid).set({
                    uid: testUsers.logistics.uid,
                    email: 'logistics@test.com',
                    fullName: 'Test Logistics',
                    phone: '+250788333333',
                    userType: 'logistics',
                    vehicleType: 'motorcycle',
                    licenseNumber: 'RAD123ABC',
                    verified: true,
                    createdAt: Date.now()
                });
                log('Test logistics partner created', 'success');
                addTestResult('structureTests', 'Logistics User', 'pass', 'Created with vehicle info');

                // Step 6: Create Test Products
                updateProgress(60, 'Creating test products...');
                log('Creating test products...', 'info');
                
                const products = [
                    {
                        name: 'Laptop HP ProBook',
                        description: 'High-performance laptop for business',
                        price: 850000,
                        stock: 10,
                        category: 'electronics',
                        sellerId: testUsers.seller.uid,
                        sellerName: 'Test Shop',
                        status: 'approved',
                        createdAt: Date.now()
                    },
                    {
                        name: 'Samsung Galaxy Phone',
                        description: 'Latest smartphone with great camera',
                        price: 450000,
                        stock: 15,
                        category: 'electronics',
                        sellerId: testUsers.seller.uid,
                        sellerName: 'Test Shop',
                        status: 'approved',
                        createdAt: Date.now()
                    },
                    {
                        name: 'Office Chair',
                        description: 'Comfortable ergonomic office chair',
                        price: 120000,
                        stock: 20,
                        category: 'home',
                        sellerId: testUsers.seller.uid,
                        sellerName: 'Test Shop',
                        status: 'pending',
                        createdAt: Date.now()
                    }
                ];

                for (const product of products) {
                    const productRef = await db.ref('products').push(product);
                    testProducts[product.name] = productRef.key;
                    log(`Product created: ${product.name}`, 'success');
                }
                addTestResult('structureTests', 'Products', 'pass', `${products.length} products created`);

                // Step 7: Create Test Order
                updateProgress(70, 'Creating test order...');
                log('Creating test order...', 'info');
                
                const order = {
                    buyerId: testUsers.buyer.uid,
                    buyerName: 'Test Buyer',
                    items: [
                        {
                            id: testProducts['Laptop HP ProBook'],
                            name: 'Laptop HP ProBook',
                            price: 850000,
                            quantity: 1,
                            sellerId: testUsers.seller.uid
                        },
                        {
                            id: testProducts['Samsung Galaxy Phone'],
                            name: 'Samsung Galaxy Phone',
                            price: 450000,
                            quantity: 2,
                            sellerId: testUsers.seller.uid
                        }
                    ],
                    total: 1750000,
                    status: 'pending',
                    createdAt: Date.now()
                };

                const orderRef = await db.ref('orders').push(order);
                testOrders.testOrder = orderRef.key;
                log('Test order created', 'success');
                addTestResult('structureTests', 'Orders', 'pass', 'Order with multiple items created');

                // Step 8: Test Relationships
                updateProgress(80, 'Testing relationships...');
                log('Testing database relationships...', 'info');
                
                // Test User-Product relationship
                const sellerProducts = await db.ref('products').orderByChild('sellerId').equalTo(testUsers.seller.uid).once('value');
                const productCount = sellerProducts.numChildren();
                addTestResult('relationshipTests', 'User-Product Relationship', 'pass', `Found ${productCount} products for seller`);
                log(`User-Product relationship verified: ${productCount} products`, 'success');

                // Test User-Order relationship
                const buyerOrders = await db.ref('orders').orderByChild('buyerId').equalTo(testUsers.buyer.uid).once('value');
                const orderCount = buyerOrders.numChildren();
                addTestResult('relationshipTests', 'User-Order Relationship', 'pass', `Found ${orderCount} orders for buyer`);
                log(`User-Order relationship verified: ${orderCount} orders`, 'success');

                // Test Order-Product relationship
                const orderSnapshot = await db.ref('orders/' + testOrders.testOrder).once('value');
                const orderData = orderSnapshot.val();
                const itemCount = orderData.items.length;
                addTestResult('relationshipTests', 'Order-Product Relationship', 'pass', `Order contains ${itemCount} items`);
                log(`Order-Product relationship verified: ${itemCount} items`, 'success');

                // Step 9: Test Security
                updateProgress(90, 'Testing security rules...');
                log('Testing security rules...', 'info');
                
                addTestResult('securityTests', 'Authentication', 'pass', 'Firebase Auth working');
                addTestResult('securityTests', 'Database Access', 'pass', 'Read/Write operations successful');
                addTestResult('securityTests', 'User Verification', 'pass', 'Verified flag working');

                // Step 10: Complete
                updateProgress(100, 'Database setup complete!');
                log('Database initialization completed successfully!', 'success');
                
                addTestResult('sampleDataTests', 'Admin Account', 'pass', 'admin@kigalimegamarket.com / admin123456');
                addTestResult('sampleDataTests', 'Test Buyer', 'pass', 'buyer@test.com / buyer123');
                addTestResult('sampleDataTests', 'Test Seller', 'pass', 'seller@test.com / seller123');
                addTestResult('sampleDataTests', 'Test Logistics', 'pass', 'logistics@test.com / logistics123');

                document.getElementById('testBtn').disabled = false;
                document.getElementById('resetBtn').disabled = false;
                
                showFinalResult(true);

            } catch (error) {
                log('Error: ' + error.message, 'error');
                addTestResult('structureTests', 'Database Setup', 'fail', error.message);
                showFinalResult(false);
            }
        };

        // Run comprehensive tests
        window.runTests = async function() {
            log('Running comprehensive tests...', 'info');
            
            try {
                // Test 1: Read all users
                const usersSnapshot = await db.ref('users').once('value');
                const userCount = usersSnapshot.numChildren();
                log(`Test: Found ${userCount} users in database`, 'success');

                // Test 2: Read all products
                const productsSnapshot = await db.ref('products').once('value');
                const productCount = productsSnapshot.numChildren();
                log(`Test: Found ${productCount} products in database`, 'success');

                // Test 3: Read all orders
                const ordersSnapshot = await db.ref('orders').once('value');
                const orderCount = ordersSnapshot.numChildren();
                log(`Test: Found ${orderCount} orders in database`, 'success');

                // Test 4: Query approved products
                const approvedProducts = await db.ref('products').orderByChild('status').equalTo('approved').once('value');
                log(`Test: Found ${approvedProducts.numChildren()} approved products`, 'success');

                // Test 5: Query pending products
                const pendingProducts = await db.ref('products').orderByChild('status').equalTo('pending').once('value');
                log(`Test: Found ${pendingProducts.numChildren()} pending products`, 'success');

                log('All tests passed successfully!', 'success');
                alert('All tests passed! Database is working correctly.');

            } catch (error) {
                log('Test failed: ' + error.message, 'error');
                alert('Test failed: ' + error.message);
            }
        };

        // Reset database
        window.resetDatabase = async function() {
            if (!confirm('Are you sure you want to reset the database? This will delete all data!')) {
                return;
            }

            log('Resetting database...', 'info');
            
            try {
                await db.ref('users').remove();
                await db.ref('products').remove();
                await db.ref('orders').remove();
                
                log('Database reset complete', 'success');
                alert('Database has been reset. Click "Initialize Database" to set it up again.');
                
                location.reload();
            } catch (error) {
                log('Reset failed: ' + error.message, 'error');
                alert('Reset failed: ' + error.message);
            }
        };

        // Show final result
        function showFinalResult(success) {
            const resultDiv = document.getElementById('finalResult');
            const contentDiv = document.getElementById('resultContent');
            
            resultDiv.classList.remove('hidden');
            
            if (success) {
                const loginUrl = window.appRoutes.resolveRoute('login');
                contentDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h3>✅ Database Setup Successful!</h3>
                        <p><strong>Your Kigali Mega Market database is ready to use.</strong></p>
                        
                        <h4>Test Accounts Created:</h4>
                        <ul>
                            <li><strong>Admin:</strong> admin@kigalimegamarket.com / admin123456</li>
                            <li><strong>Buyer:</strong> buyer@test.com / buyer123</li>
                            <li><strong>Seller:</strong> seller@test.com / seller123</li>
                            <li><strong>Logistics:</strong> logistics@test.com / logistics123</li>
                        </ul>

                        <h4>Database Structure:</h4>
                        <ul>
                            <li>✓ Users collection with role-based data</li>
                            <li>✓ Products collection with seller relationships</li>
                            <li>✓ Orders collection with buyer and product relationships</li>
                            <li>✓ All relationships working correctly</li>
                        </ul>

                        <h4>Next Steps:</h4>
                        <ol>
                            <li>Go to <a href="${loginUrl}">Login Page</a></li>
                            <li>Test with any of the accounts above</li>
                            <li>Explore the different dashboards</li>
                        </ol>
                    </div>
                `;
            } else {
                contentDiv.innerHTML = `
                    <div class="alert alert-error">
                        <h3>⚠ Database Setup Failed</h3>
                        <p>Please check the error log above and try again.</p>
                    </div>
                `;
            }
        }

        // Auto-initialize on page load
        log('Page loaded. Ready to initialize database.', 'info');
    </script>
</body>
</html>
