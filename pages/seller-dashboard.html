<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Kigali Mega Market</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .dashboard { padding: 2rem 0; background: var(--light-gray); min-height: 100vh; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; padding: 1.5rem; border-radius: var(--border-radius); }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--light-gray); }
        .tab { padding: 1rem 2rem; cursor: pointer; border: none; background: none; font-size: 1rem; font-weight: 600; color: var(--gray); }
        .tab.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 Kigali Mega Market</h1>
            </div>
            <div class="nav-links">
                <span id="userName"></span>
                <button onclick="logout()" class="btn-secondary btn-small">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="container">
            <h2>Seller Dashboard</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div>Total Products</div>
                    <div class="stat-value" id="totalProducts">0</div>
                </div>
                <div class="stat-card">
                    <div>Pending Orders</div>
                    <div class="stat-value" id="pendingOrders">0</div>
                </div>
                <div class="stat-card">
                    <div>Total Sales</div>
                    <div class="stat-value" id="totalSales">0 RWF</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('products')">My Products</button>
                <button class="tab" onclick="switchTab('requests')">Buyer Requests</button>
                <button class="tab" onclick="switchTab('add')">Add Product</button>
            </div>

            <div id="productsTab" class="tab-content active">
                <div id="productsGrid" class="grid-3">
                    <div class="spinner"></div>
                </div>
            </div>

            <div id="requestsTab" class="tab-content">
                <h3>Buyer Product Requests</h3>
                <div id="requestsContainer" class="grid-3">
                    <div class="spinner"></div>
                </div>
            </div>

            <div id="addTab" class="tab-content">
                <div class="card" style="max-width: 600px;">
                    <h3>Add New Product</h3>
                    <form id="addProductForm">
                        <div class="form-group">
                            <label>Product Image (Optional)</label>
                            <input type="text" id="productImage" class="form-control" placeholder="Image URL or emoji (e.g., 📱, 👕, 🏠)">
                            <small>You can paste an image URL or use an emoji</small>
                        </div>
                        <div class="form-group">
                            <label>Product Name/Title</label>
                            <input type="text" id="productName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Product Description</label>
                            <textarea id="productDesc" class="form-control" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Price (RWF)</label>
                            <input type="number" id="productPrice" class="form-control" required min="0">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="productCategory" class="form-control" required>
                                <option value="">Select category</option>
                                <option value="electronics">Electronics</option>
                                <option value="fashion">Fashion</option>
                                <option value="agriculture">Agriculture</option>
                                <option value="furniture">Furniture</option>
                                <option value="home">Home & Garden</option>
                                <option value="beauty">Beauty & Health</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary">Submit for Admin Approval</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script type="module">
        import firebaseConfig from '../config/firebase.js';
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;

        window.logout = () => {
            auth.signOut().then(() => window.location.href = '../index.html');
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            if (tab === 'requests') loadRequests();
        };

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const snapshot = await db.ref('users/' + user.uid).once('value');
            currentUser = snapshot.val();
            
            if (currentUser.userType !== 'seller') {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('userName').textContent = currentUser.fullName;
            loadProducts();
            loadStats();
        });

        async function loadProducts() {
            const snapshot = await db.ref('products').orderByChild('sellerId').equalTo(auth.currentUser.uid).once('value');
            const products = [];
            
            snapshot.forEach((child) => {
                products.push({ id: child.key, ...child.val() });
            });

            displayProducts(products);
        }

        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                grid.innerHTML = '<p>No products yet. Add your first product!</p>';
                return;
            }

            grid.innerHTML = products.map(product => {
                const statusBadge = product.status === 'approved' ? 'badge-success' : 
                                   product.status === 'pending' ? 'badge-warning' : 'badge-danger';
                
                return `
                    <div class="card">
                        <div class="flex-between mb-1">
                            <strong>${product.name}</strong>
                            <span class="badge ${statusBadge}">${product.status}</span>
                        </div>
                        <p style="font-size: 0.9rem; color: var(--gray);">${product.description}</p>
                        <p><strong>Price:</strong> ${product.price} RWF</p>
                        <p><strong>Stock:</strong> ${product.stock}</p>
                        <button onclick="deleteProduct('${product.id}')" class="btn-danger btn-small">Delete</button>
                    </div>
                `;
            }).join('');
        }

        async function loadRequests() {
            const snapshot = await db.ref('requests').once('value');
            const requests = [];
            
            snapshot.forEach((child) => {
                requests.push({ id: child.key, ...child.val() });
            });

            requests.sort((a, b) => b.createdAt - a.createdAt);
            displayRequests(requests);
        }

        function displayRequests(requests) {
            const container = document.getElementById('requestsContainer');
            
            if (requests.length === 0) {
                container.innerHTML = '<p>No buyer requests yet</p>';
                return;
            }

            container.innerHTML = requests.map(request => `
                <div class="card" style="background: #fef3c7; border-left: 4px solid var(--warning-color);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span class="badge badge-warning">${request.category}</span>
                        <small>${new Date(request.createdAt).toLocaleDateString()}</small>
                    </div>
                    <p style="font-size: 0.95rem; margin-bottom: 0.5rem;">${request.description}</p>
                    <div style="color: var(--secondary-color); font-weight: 600; margin-bottom: 0.5rem;">
                        Budget: ${request.minBudget} - ${request.maxBudget} RWF
                    </div>
                    <p style="font-size: 0.85rem; color: var(--gray);">Quantity: ${request.quantity}</p>
                    <div style="font-size: 0.85rem; color: var(--gray); margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--light-gray);">
                        <strong>Contact:</strong> ${request.buyerContact}
                    </div>
                </div>
            `).join('');
        }

        async function loadOrders() {
            const snapshot = await db.ref('orders').once('value');
            const orders = [];
            
            snapshot.forEach((child) => {
                const order = { id: child.key, ...child.val() };
                // Filter orders that contain seller's products
                const hasMyProducts = order.items.some(item => item.sellerId === auth.currentUser.uid);
                if (hasMyProducts) {
                    orders.push(order);
                }
            });

            orders.sort((a, b) => b.createdAt - a.createdAt);
            displayOrders(orders);
        }

        function displayOrders(orders) {
            const container = document.getElementById('ordersContainer');
            
            if (orders.length === 0) {
                container.innerHTML = '<p>No orders yet</p>';
                return;
            }

            container.innerHTML = orders.map(order => {
                const myItems = order.items.filter(item => item.sellerId === auth.currentUser.uid);
                const date = new Date(order.createdAt).toLocaleString();
                
                return `
                    <div class="card mb-1">
                        <div class="flex-between mb-1">
                            <div>
                                <strong>Order #${order.id.substring(0, 8)}</strong><br>
                                <small>${date}</small>
                            </div>
                            <span class="badge badge-info">${order.status}</span>
                        </div>
                        <p><strong>Buyer:</strong> ${order.buyerName}</p>
                        ${myItems.map(item => `
                            <div style="padding: 0.5rem 0; border-top: 1px solid var(--light-gray);">
                                ${item.name} - ${item.quantity} x ${item.price} RWF
                            </div>
                        `).join('')}
                        ${order.status === 'pending' ? `
                            <button onclick="updateOrderStatus('${order.id}', 'confirmed')" class="btn-success btn-small mt-1">Confirm Order</button>
                        ` : ''}
                        ${order.status === 'confirmed' ? `
                            <button onclick="updateOrderStatus('${order.id}', 'ready')" class="btn-success btn-small mt-1">Mark as Ready</button>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        window.updateOrderStatus = async (orderId, status) => {
            try {
                await db.ref('orders/' + orderId).update({ status });
                alert('Order status updated!');
                loadOrders();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        window.deleteProduct = async (productId) => {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                await db.ref('products/' + productId).remove();
                alert('Product deleted!');
                loadProducts();
                loadStats();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        async function loadStats() {
            const productsSnapshot = await db.ref('products').orderByChild('sellerId').equalTo(auth.currentUser.uid).once('value');
            const ordersSnapshot = await db.ref('orders').once('value');
            
            let totalProducts = 0;
            let pendingOrders = 0;
            let totalSales = 0;
            
            productsSnapshot.forEach(() => totalProducts++);
            
            ordersSnapshot.forEach((child) => {
                const order = child.val();
                const hasMyProducts = order.items.some(item => item.sellerId === auth.currentUser.uid);
                
                if (hasMyProducts) {
                    if (order.status === 'pending' || order.status === 'confirmed') {
                        pendingOrders++;
                    }
                    if (order.status === 'delivered') {
                        const myItemsTotal = order.items
                            .filter(item => item.sellerId === auth.currentUser.uid)
                            .reduce((sum, item) => sum + (item.price * item.quantity), 0);
                        totalSales += myItemsTotal;
                    }
                }
            });
            
            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('pendingOrders').textContent = pendingOrders;
            document.getElementById('totalSales').textContent = totalSales + ' RWF';
        }

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const product = {
                name: document.getElementById('productName').value,
                description: document.getElementById('productDesc').value,
                price: parseInt(document.getElementById('productPrice').value),
                category: document.getElementById('productCategory').value,
                imageUrl: document.getElementById('productImage').value || '📦',
                sellerId: auth.currentUser.uid,
                sellerName: currentUser.businessName || currentUser.fullName,
                sellerContact: currentUser.phone || currentUser.email,
                status: 'pending',
                createdAt: Date.now()
            };

            try {
                await db.ref('products').push(product);
                alert('Product submitted for admin approval! You will be notified once approved.');
                e.target.reset();
                switchTab('products');
                loadProducts();
                loadStats();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
