<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Kigali Mega Market</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .dashboard { padding: 2rem 0; background: var(--light-gray); min-height: 100vh; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; padding: 1.5rem; border-radius: var(--border-radius); }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--light-gray); }
        .tab { padding: 1rem 2rem; cursor: pointer; border: none; background: none; font-size: 1rem; font-weight: 600; color: var(--gray); }
        .tab.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .empty-state { text-align: center; padding: 3rem; color: var(--gray); }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 Kigali Mega Market</h1>
            </div>
            <div class="nav-links">
                <span id="userName">Loading...</span>
                <button onclick="window.logoutUser()" class="btn-secondary btn-small">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="container">
            <h2>Seller Dashboard</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div>Total Products</div>
                    <div class="stat-value" id="totalProducts">0</div>
                </div>
                <div class="stat-card">
                    <div>Approved Products</div>
                    <div class="stat-value" id="approvedProducts">0</div>
                </div>
                <div class="stat-card">
                    <div>Pending Approval</div>
                    <div class="stat-value" id="pendingProducts">0</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('products')">My Products</button>
                <button class="tab" onclick="switchTab('requests')">Buyer Requests</button>
                <button class="tab" onclick="switchTab('add')">Add Product</button>
            </div>

            <div id="productsTab" class="tab-content active">
                <div id="productsGrid" class="grid-3">
                    <div class="spinner"></div>
                </div>
            </div>

            <div id="requestsTab" class="tab-content">
                <h3>Buyer Product Requests</h3>
                <div id="requestsContainer" class="grid-3">
                    <div class="spinner"></div>
                </div>
            </div>

            <div id="addTab" class="tab-content">
                <div class="card" style="max-width: 600px;">
                    <h3>Add New Product</h3>
                    <form id="addProductForm">
                        <div class="form-group">
                            <label>Product Image (Optional)</label>
                            <input type="text" id="productImage" class="form-control" placeholder="Image URL or emoji (e.g., 📱, 👕, 🏠)">
                            <small>You can paste an image URL or use an emoji</small>
                        </div>
                        <div class="form-group">
                            <label>Product Name/Title</label>
                            <input type="text" id="productName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Product Description</label>
                            <textarea id="productDesc" class="form-control" required rows="4"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Price (RWF)</label>
                            <input type="number" id="productPrice" class="form-control" required min="0">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="productCategory" class="form-control" required>
                                <option value="">Select category</option>
                                <option value="electronics">Electronics</option>
                                <option value="fashion">Fashion</option>
                                <option value="agriculture">Agriculture</option>
                                <option value="furniture">Furniture</option>
                                <option value="home">Home & Garden</option>
                                <option value="beauty">Beauty & Health</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <button type="submit" id="submitProductBtn" class="btn-primary">Submit for Admin Approval</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Core App Module -->
    <script type="module">
        import '../js/app.js';
        
        let currentUser = null;
        
        // Protect page and initialize
        window.addEventListener('load', async () => {
            currentUser = await window.protectPage('seller');
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.userData.fullName;
                await loadProducts();
                await loadStats();
            }
        });
        
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            if (tab === 'requests') loadRequests();
        };
        
        async function loadProducts() {
            try {
                const products = await window.queryCollection('products', {
                    orderBy: 'sellerId',
                    equalTo: currentUser.user.uid
                });
                
                displayProducts(products.sort((a, b) => b.createdAt - a.createdAt));
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsGrid').innerHTML = '<p class="empty-state">Error loading products</p>';
            }
        }
        
        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📦</div>
                        <p>No products yet. Add your first product!</p>
                        <button onclick="switchTab('add')" class="btn-primary mt-1">Add Product</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = products.map(product => {
                const statusBadge = product.status === 'approved' ? 'badge-success' : 
                                   product.status === 'pending' ? 'badge-warning' : 'badge-danger';
                
                return `
                    <div class="card">
                        <div class="flex-between mb-1">
                            <strong>${product.name}</strong>
                            <span class="badge ${statusBadge}">${product.status}</span>
                        </div>
                        <p style="font-size: 0.9rem; color: var(--gray);">${product.description}</p>
                        <p><strong>Price:</strong> ${window.formatCurrency(product.price)}</p>
                        <p><strong>Category:</strong> ${product.category}</p>
                        ${product.status === 'rejected' && product.rejectionReason ? 
                            `<div class="alert alert-error" style="margin-top: 0.5rem; padding: 0.5rem;">
                                <strong>Rejection Reason:</strong> ${product.rejectionReason}
                            </div>` : ''}
                        <button onclick="deleteProduct('${product.id}')" class="btn-danger btn-small mt-1">Delete</button>
                    </div>
                `;
            }).join('');
        }
        
        window.deleteProduct = async (productId) => {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                await window.deleteDocument('products', productId);
                window.showAlert('Product deleted successfully', 'success');
                await loadProducts();
                await loadStats();
            } catch (error) {
                window.showAlert('Error deleting product: ' + error.message, 'error');
            }
        };
        
        async function loadRequests() {
            try {
                const requests = await window.queryCollection('requests');
                displayRequests(requests.sort((a, b) => b.createdAt - a.createdAt));
            } catch (error) {
                console.error('Error loading requests:', error);
                document.getElementById('requestsContainer').innerHTML = '<p class="empty-state">Error loading requests</p>';
            }
        }
        
        function displayRequests(requests) {
            const container = document.getElementById('requestsContainer');
            
            if (requests.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">🔍</div>
                        <p>No buyer requests yet</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = requests.map(request => `
                <div class="card" style="background: #fef3c7; border-left: 4px solid var(--warning-color);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span class="badge badge-warning">${request.category}</span>
                        <small>${window.formatDate(request.createdAt)}</small>
                    </div>
                    <p style="font-size: 0.95rem; margin-bottom: 0.5rem;">${request.description}</p>
                    <div style="color: var(--secondary-color); font-weight: 600; margin-bottom: 0.5rem;">
                        Budget: ${window.formatCurrency(request.minBudget)} - ${window.formatCurrency(request.maxBudget)}
                    </div>
                    <p style="font-size: 0.85rem; color: var(--gray);">Quantity: ${request.quantity}</p>
                    <div style="font-size: 0.85rem; color: var(--gray); margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--light-gray);">
                        <strong>Contact:</strong> ${request.buyerContact}
                    </div>
                </div>
            `).join('');
        }
        
        async function loadStats() {
            try {
                const products = await window.queryCollection('products', {
                    orderBy: 'sellerId',
                    equalTo: currentUser.user.uid
                });
                
                const total = products.length;
                const approved = products.filter(p => p.status === 'approved').length;
                const pending = products.filter(p => p.status === 'pending').length;
                
                document.getElementById('totalProducts').textContent = total;
                document.getElementById('approvedProducts').textContent = approved;
                document.getElementById('pendingProducts').textContent = pending;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitProductBtn');
            
            try {
                window.setButtonLoading(submitBtn, true);
                
                const product = {
                    name: document.getElementById('productName').value.trim(),
                    description: document.getElementById('productDesc').value.trim(),
                    price: parseInt(document.getElementById('productPrice').value),
                    category: document.getElementById('productCategory').value,
                    imageUrl: document.getElementById('productImage').value.trim() || '📦',
                    sellerId: currentUser.user.uid,
                    sellerName: currentUser.userData.businessName || currentUser.userData.fullName,
                    sellerContact: currentUser.userData.phone || currentUser.userData.email,
                    status: 'pending'
                };
                
                await window.createDocument('products', product);
                
                window.showAlert('Product submitted for admin approval! You will be notified once approved.', 'success');
                document.getElementById('addProductForm').reset();
                switchTab('products');
                await loadProducts();
                await loadStats();
                
            } catch (error) {
                window.showAlert('Error adding product: ' + error.message, 'error');
            } finally {
                window.setButtonLoading(submitBtn, false);
            }
        });
    </script>
</body>
</html>
