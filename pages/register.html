<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Kigali Mega Market</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--light-gray);
            padding: 2rem 0;
        }
        .auth-card {
            max-width: 500px;
            width: 100%;
            background: var(--white);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow-lg);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🛒 Kigali Mega Market</h1>
                <h2>Create Account</h2>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>Account Type</label>
                    <select id="userType" class="form-control" required>
                        <option value="">Select account type</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required minlength="6">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>

                <div id="sellerFields" class="hidden">
                    <div class="form-group">
                        <label>Business Name</label>
                        <input type="text" id="businessName" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Business Address</label>
                        <textarea id="businessAddress" class="form-control"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
            </form>

            <p class="text-center mt-2">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script type="module">
        import firebaseConfig from '../config/firebase.js';
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Show/hide role-specific fields
        document.getElementById('userType').addEventListener('change', (e) => {
            const sellerFields = document.getElementById('sellerFields');
            
            sellerFields.classList.add('hidden');
            
            if (e.target.value === 'seller') {
                sellerFields.classList.remove('hidden');
            }
        });

        // Check URL params for pre-selected type
        const urlParams = new URLSearchParams(window.location.search);
        const typeParam = urlParams.get('type');
        if (typeParam) {
            document.getElementById('userType').value = typeParam;
            document.getElementById('userType').dispatchEvent(new Event('change'));
        }

        // Handle registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            const email = document.getElementById('email').value;
            const userType = document.getElementById('userType').value;
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                const userData = {
                    uid: user.uid,
                    email: email,
                    fullName: document.getElementById('fullName').value,
                    phone: document.getElementById('phone').value,
                    userType: userType,
                    verified: false,
                    createdAt: Date.now()
                };

                if (userType === 'seller') {
                    userData.businessName = document.getElementById('businessName').value;
                    userData.businessAddress = document.getElementById('businessAddress').value;
                }

                await db.ref('users/' + user.uid).set(userData);
                
                alert('Registration successful! Please wait for admin verification.');
                window.location.href = 'login.html';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
