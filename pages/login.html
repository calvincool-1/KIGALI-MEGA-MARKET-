<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kigali Mega Market</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--light-gray);
        }
        .auth-card {
            max-width: 450px;
            width: 100%;
            background: var(--white);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow-lg);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .form-error {
            color: var(--danger-color);
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        .form-error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🛒 Kigali Mega Market</h1>
                <h2>Welcome Back</h2>
                <p style="color: var(--gray);">Login to your account</p>
            </div>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        required
                        autocomplete="email"
                        placeholder="Enter your email">
                    <div class="form-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        minlength="6">
                    <div class="form-error" id="passwordError"></div>
                </div>

                <button type="submit" id="loginBtn" class="btn-primary" style="width: 100%;">
                    Login
                </button>
            </form>

            <p class="text-center mt-2">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
            
            <p class="text-center" style="margin-top: 1rem;">
                <a href="../index.html" style="color: var(--gray);">← Back to Home</a>
            </p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Core App Module -->
    <script type="module">
        import '../js/app.js';
        
        // Check if already logged in
        window.addEventListener('load', async () => {
            const currentUser = await window.getCurrentUser();
            if (currentUser) {
                // Already logged in - redirect to dashboard
                window.redirectByRole(currentUser.userData.userType);
            }
        });
        
        // Form validation
        function validateForm() {
            let isValid = true;
            
            // Email validation
            const email = document.getElementById('email').value.trim();
            const emailError = document.getElementById('emailError');
            
            if (!email) {
                emailError.textContent = 'Email is required';
                emailError.classList.add('show');
                isValid = false;
            } else if (!window.validateEmail(email)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
                isValid = false;
            } else {
                emailError.classList.remove('show');
            }
            
            // Password validation
            const password = document.getElementById('password').value;
            const passwordError = document.getElementById('passwordError');
            
            if (!password) {
                passwordError.textContent = 'Password is required';
                passwordError.classList.add('show');
                isValid = false;
            } else if (password.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('show');
                isValid = false;
            } else {
                passwordError.classList.remove('show');
            }
            
            return isValid;
        }
        
        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validate form
            if (!validateForm()) {
                return;
            }
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            try {
                // Show loading state
                window.setButtonLoading(loginBtn, true);
                
                // Attempt login
                const { user, userData } = await window.loginUser(email, password);
                
                // Show success message
                window.showAlert('Login successful! Redirecting...', 'success');
                
                // Redirect based on role after short delay
                setTimeout(() => {
                    window.redirectByRole(userData.userType);
                }, 1000);
                
            } catch (error) {
                // Show error message
                window.showAlert(error.message, 'error');
                window.setButtonLoading(loginBtn, false);
            }
        });
        
        // Clear errors on input
        document.getElementById('email').addEventListener('input', () => {
            document.getElementById('emailError').classList.remove('show');
        });
        
        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('passwordError').classList.remove('show');
        });
    </script>
</body>
</html>
