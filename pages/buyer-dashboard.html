<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Kigali Mega Market</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .dashboard { padding: 2rem 0; background: var(--light-gray); min-height: 100vh; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .marketplace-section { background: white; padding: 2rem; border-radius: var(--border-radius); margin-bottom: 2rem; box-shadow: var(--box-shadow); }
        .product-card { position: relative; }
        .product-image { width: 100%; height: 200px; object-fit: cover; border-radius: var(--border-radius); margin-bottom: 1rem; background: var(--light-gray); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .product-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .product-price { color: var(--primary-color); font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .seller-contact { font-size: 0.85rem; color: var(--gray); margin-top: 0.5rem; }
        .request-card { background: #fef3c7; border-left: 4px solid var(--warning-color); }
        .budget-range { color: var(--secondary-color); font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 Kigali Mega Market</h1>
            </div>
            <div class="nav-links">
                <a href="buyer-dashboard.html">Marketplace</a>
                <a href="buyer-requests.html">My Requests</a>
                <span id="userName"></span>
                <button onclick="logout()" class="btn-secondary btn-small">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="container">
            <!-- Products Section -->
            <div class="marketplace-section">
                <div class="section-header">
                    <h2>📦 Available Products</h2>
                    <input type="text" id="searchProducts" class="form-control" placeholder="Search products..." style="max-width: 300px;">
                </div>
                <div id="productsGrid" class="grid-4">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- Requested Products Section -->
            <div class="marketplace-section">
                <div class="section-header">
                    <h2>🔍 Requested Products</h2>
                    <button onclick="showRequestModal()" class="btn-primary">+ Create Request</button>
                </div>
                <div id="requestsGrid" class="grid-3">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Request Modal -->
    <div id="requestModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Product Request</h3>
                <button class="modal-close" onclick="closeRequestModal()">&times;</button>
            </div>
            <form id="requestForm">
                <div class="form-group">
                    <label>Product Category</label>
                    <select id="category" class="form-control" required>
                        <option value="">Select category</option>
                        <option value="electronics">Electronics</option>
                        <option value="fashion">Fashion</option>
                        <option value="agriculture">Agriculture</option>
                        <option value="furniture">Furniture</option>
                        <option value="home">Home & Garden</option>
                        <option value="beauty">Beauty & Health</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Product Description</label>
                    <textarea id="description" class="form-control" required placeholder="Describe what you're looking for..."></textarea>
                </div>
                <div class="form-group">
                    <label>Budget Range (RWF)</label>
                    <div style="display: flex; gap: 1rem;">
                        <input type="number" id="minBudget" class="form-control" placeholder="Min" required>
                        <input type="number" id="maxBudget" class="form-control" placeholder="Max" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Quantity Required</label>
                    <input type="number" id="quantity" class="form-control" required min="1">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Submit Request</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script type="module">
        import firebaseConfig from '../config/firebase.js';
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let cart = [];
        let allProducts = [];

        window.logout = () => {
            auth.signOut().then(() => window.location.href = '../index.html');
        };

        let allProducts = [];
        let allRequests = [];

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const snapshot = await db.ref('users/' + user.uid).once('value');
            const currentUser = snapshot.val();
            
            if (currentUser.userType !== 'buyer') {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('userName').textContent = currentUser.fullName;
            loadProducts();
            loadRequests();
        });

        // Load approved products
        async function loadProducts() {
            const snapshot = await db.ref('products').orderByChild('status').equalTo('approved').once('value');
            allProducts = [];
            
            snapshot.forEach((child) => {
                allProducts.push({ id: child.key, ...child.val() });
            });

            displayProducts(allProducts);
        }

        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                grid.innerHTML = '<p>No approved products available yet</p>';
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="card product-card">
                    <div class="product-image">${product.imageUrl || '📦'}</div>
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${product.price} RWF</div>
                    <p style="font-size: 0.9rem; color: var(--gray);">${product.description}</p>
                    <div class="seller-contact">
                        <strong>Seller:</strong> ${product.sellerName}<br>
                        <strong>Contact:</strong> ${product.sellerContact || 'N/A'}
                    </div>
                </div>
            `).join('');
        }

        // Search products
        document.getElementById('searchProducts').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.description.toLowerCase().includes(query)
            );
            displayProducts(filtered);
        });

        // Load buyer requests
        async function loadRequests() {
            const snapshot = await db.ref('requests').once('value');
            allRequests = [];
            
            snapshot.forEach((child) => {
                allRequests.push({ id: child.key, ...child.val() });
            });

            allRequests.sort((a, b) => b.createdAt - a.createdAt);
            displayRequests(allRequests);
        }

        function displayRequests(requests) {
            const grid = document.getElementById('requestsGrid');
            
            if (requests.length === 0) {
                grid.innerHTML = '<p>No product requests yet. Be the first to create one!</p>';
                return;
            }

            grid.innerHTML = requests.map(request => `
                <div class="card request-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span class="badge badge-warning">${request.category}</span>
                        <small>${new Date(request.createdAt).toLocaleDateString()}</small>
                    </div>
                    <p style="font-size: 0.95rem; margin-bottom: 0.5rem;">${request.description}</p>
                    <div class="budget-range">Budget: ${request.minBudget} - ${request.maxBudget} RWF</div>
                    <p style="font-size: 0.85rem; color: var(--gray);">Quantity: ${request.quantity}</p>
                    <div style="font-size: 0.85rem; color: var(--gray); margin-top: 0.5rem;">
                        <strong>Requested by:</strong> ${request.buyerName}<br>
                        <strong>Contact:</strong> ${request.buyerContact}
                    </div>
                </div>
            `).join('');
        }

        // Show request modal
        window.showRequestModal = () => {
            document.getElementById('requestModal').classList.add('active');
        };

        window.closeRequestModal = () => {
            document.getElementById('requestModal').classList.remove('active');
        };

        // Submit request
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user = auth.currentUser;
            const userSnapshot = await db.ref('users/' + user.uid).once('value');
            const userData = userSnapshot.val();

            const request = {
                buyerId: user.uid,
                buyerName: userData.fullName,
                buyerContact: userData.phone || userData.email,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                minBudget: parseInt(document.getElementById('minBudget').value),
                maxBudget: parseInt(document.getElementById('maxBudget').value),
                quantity: parseInt(document.getElementById('quantity').value),
                status: 'active',
                createdAt: Date.now()
            };

            try {
                await db.ref('requests').push(request);
                alert('Request submitted successfully! Sellers can now see your request.');
                closeRequestModal();
                document.getElementById('requestForm').reset();
                loadRequests();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
