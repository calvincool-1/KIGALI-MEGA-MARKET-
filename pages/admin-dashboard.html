<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kigali Mega Market</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .dashboard { padding: 2rem 0; background: var(--light-gray); min-height: 100vh; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; padding: 1.5rem; border-radius: var(--border-radius); }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--light-gray); flex-wrap: wrap; }
        .tab { padding: 1rem 2rem; cursor: pointer; border: none; background: none; font-size: 1rem; font-weight: 600; color: var(--gray); }
        .tab.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .empty-state { text-align: center; padding: 3rem; color: var(--gray); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 Kigali Mega Market - Admin</h1>
            </div>
            <div class="nav-links">
                <span id="userName">Loading...</span>
                <button onclick="window.logoutUser()" class="btn-secondary btn-small">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="container">
            <h2>Admin Dashboard</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div>Total Users</div>
                    <div class="stat-value" id="totalUsers">0</div>
                </div>
                <div class="stat-card">
                    <div>Pending Verifications</div>
                    <div class="stat-value" id="pendingUsers">0</div>
                </div>
                <div class="stat-card">
                    <div>Pending Products</div>
                    <div class="stat-value" id="pendingProducts">0</div>
                </div>
                <div class="stat-card">
                    <div>Buyer Requests</div>
                    <div class="stat-value" id="totalRequests">0</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('products')">Product Approval</button>
                <button class="tab" onclick="switchTab('requests')">Buyer Requests</button>
                <button class="tab" onclick="switchTab('users')">User Verification</button>
            </div>

            <div id="productsTab" class="tab-content active">
                <h3>Pending Product Approvals</h3>
                <div id="productsContainer">
                    <div class="spinner"></div>
                </div>
            </div>

            <div id="requestsTab" class="tab-content">
                <h3>Buyer Requests Monitoring</h3>
                <p style="color: var(--gray); margin-bottom: 1rem;">Monitor buyer requests. Remove spam or inappropriate content if necessary.</p>
                <div id="requestsContainer" class="grid-3">
                    <div class="spinner"></div>
                </div>
            </div>

            <div id="usersTab" class="tab-content">
                <h3>Pending User Verifications</h3>
                <div id="usersContainer">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Core App Module -->
    <script type="module">
        import '../js/app.js';
        
        let currentUser = null;
        
        // Protect page and initialize
        window.addEventListener('load', async () => {
            currentUser = await window.protectPage('admin');
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.userData.fullName;
                await loadProducts();
                await loadStats();
            }
        });
        
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            if (tab === 'products') loadProducts();
            if (tab === 'requests') loadRequests();
            if (tab === 'users') loadUsers();
        };
        
        async function loadProducts() {
            try {
                const products = await window.queryCollection('products', {
                    orderBy: 'status',
                    equalTo: 'pending'
                });
                
                displayProducts(products.sort((a, b) => b.createdAt - a.createdAt));
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContainer').innerHTML = '<p class="empty-state">Error loading products</p>';
            }
        }
        
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            
            if (products.length === 0) {
                container.innerHTML = '<p class="empty-state">No pending product approvals</p>';
                return;
            }

            container.innerHTML = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Seller</th>
                            <th>Price</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(product => `
                            <tr>
                                <td>${product.name}</td>
                                <td>${product.sellerName}</td>
                                <td>${window.formatCurrency(product.price)}</td>
                                <td>${product.description.substring(0, 50)}...</td>
                                <td><span class="badge badge-info">${product.category}</span></td>
                                <td>
                                    <button onclick="approveProduct('${product.id}')" class="btn-success btn-small">Approve</button>
                                    <button onclick="rejectProduct('${product.id}')" class="btn-danger btn-small">Reject</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        window.approveProduct = async (productId) => {
            try {
                await window.updateDocument('products', productId, { 
                    status: 'approved',
                    approvedAt: Date.now()
                });
                window.showAlert('Product approved and published to marketplace!', 'success');
                await loadProducts();
                await loadStats();
            } catch (error) {
                window.showAlert('Error approving product: ' + error.message, 'error');
            }
        };
        
        window.rejectProduct = async (productId) => {
            const feedback = prompt('Rejection reason (will be sent to seller):');
            if (!feedback) return;
            
            try {
                await window.updateDocument('products', productId, { 
                    status: 'rejected',
                    rejectionReason: feedback,
                    rejectedAt: Date.now()
                });
                window.showAlert('Product rejected with feedback', 'success');
                await loadProducts();
                await loadStats();
            } catch (error) {
                window.showAlert('Error rejecting product: ' + error.message, 'error');
            }
        };
        
        async function loadRequests() {
            try {
                const requests = await window.queryCollection('requests');
                displayRequests(requests.sort((a, b) => b.createdAt - a.createdAt));
            } catch (error) {
                console.error('Error loading requests:', error);
                document.getElementById('requestsContainer').innerHTML = '<p class="empty-state">Error loading requests</p>';
            }
        }
        
        function displayRequests(requests) {
            const container = document.getElementById('requestsContainer');
            
            if (requests.length === 0) {
                container.innerHTML = '<p class="empty-state">No buyer requests</p>';
                return;
            }

            container.innerHTML = requests.map(request => `
                <div class="card" style="background: #fef3c7; border-left: 4px solid var(--warning-color);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span class="badge badge-warning">${request.category}</span>
                        <small>${window.formatDate(request.createdAt)}</small>
                    </div>
                    <p style="font-size: 0.95rem; margin-bottom: 0.5rem;">${request.description}</p>
                    <div style="color: var(--secondary-color); font-weight: 600; margin-bottom: 0.5rem;">
                        Budget: ${window.formatCurrency(request.minBudget)} - ${window.formatCurrency(request.maxBudget)}
                    </div>
                    <p style="font-size: 0.85rem; color: var(--gray);">Quantity: ${request.quantity}</p>
                    <div style="font-size: 0.85rem; color: var(--gray); margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--light-gray);">
                        <strong>Buyer:</strong> ${request.buyerName}<br>
                        <strong>Contact:</strong> ${request.buyerContact}
                    </div>
                    <button onclick="removeRequest('${request.id}')" class="btn-danger btn-small mt-1">Remove (Spam)</button>
                </div>
            `).join('');
        }
        
        window.removeRequest = async (requestId) => {
            if (!confirm('Remove this request? This action cannot be undone.')) return;
            
            try {
                await window.deleteDocument('requests', requestId);
                window.showAlert('Request removed', 'success');
                await loadRequests();
                await loadStats();
            } catch (error) {
                window.showAlert('Error removing request: ' + error.message, 'error');
            }
        };
        
        async function loadUsers() {
            try {
                const allUsers = await window.queryCollection('users');
                const pendingUsers = allUsers.filter(u => !u.verified && u.userType !== 'admin');
                displayUsers(pendingUsers);
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersContainer').innerHTML = '<p class="empty-state">Error loading users</p>';
            }
        }
        
        function displayUsers(users) {
            const container = document.getElementById('usersContainer');
            
            if (users.length === 0) {
                container.innerHTML = '<p class="empty-state">No pending verifications</p>';
                return;
            }

            container.innerHTML = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Type</th>
                            <th>Phone</th>
                            <th>Registered</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr>
                                <td>${user.fullName}</td>
                                <td>${user.email}</td>
                                <td><span class="badge badge-info">${user.userType}</span></td>
                                <td>${user.phone}</td>
                                <td>${window.formatDate(user.createdAt)}</td>
                                <td>
                                    <button onclick="verifyUser('${user.uid}')" class="btn-success btn-small">Approve</button>
                                    <button onclick="rejectUser('${user.uid}')" class="btn-danger btn-small">Reject</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        window.verifyUser = async (userId) => {
            try {
                await window.updateDocument('users', userId, { verified: true });
                window.showAlert('User verified successfully!', 'success');
                await loadUsers();
                await loadStats();
            } catch (error) {
                window.showAlert('Error verifying user: ' + error.message, 'error');
            }
        };
        
        window.rejectUser = async (userId) => {
            if (!confirm('Are you sure you want to reject this user? This will delete their account.')) return;
            
            try {
                await window.deleteDocument('users', userId);
                window.showAlert('User rejected and removed', 'success');
                await loadUsers();
                await loadStats();
            } catch (error) {
                window.showAlert('Error rejecting user: ' + error.message, 'error');
            }
        };
        
        async function loadStats() {
            try {
                const allUsers = await window.queryCollection('users');
                const allProducts = await window.queryCollection('products');
                const allRequests = await window.queryCollection('requests');
                
                const totalUsers = allUsers.filter(u => u.userType !== 'admin').length;
                const pendingUsers = allUsers.filter(u => !u.verified && u.userType !== 'admin').length;
                const pendingProducts = allProducts.filter(p => p.status === 'pending').length;
                
                document.getElementById('totalUsers').textContent = totalUsers;
                document.getElementById('pendingUsers').textContent = pendingUsers;
                document.getElementById('pendingProducts').textContent = pendingProducts;
                document.getElementById('totalRequests').textContent = allRequests.length;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
    </script>
</body>
</html>
